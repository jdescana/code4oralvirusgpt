experiment_id: sensitivity_T
description: Sweep T over MC Dropout pass count (Supp. Table S5 top block).
seed: 42
phases: [phase3]
sweep:
  variable: T
  values: [5, 10, 20, 50]
data:
  primary: code
model:
  fusion: hgcf
uq:
  mc_dropout:
    num_samples: 20
    dropout_p: 0.1
  temperature:
    enabled: true
  raps:
    enabled: true
    alpha: 0.05
    penalty: 0.01
  risk_tier:
    auto_calibrate: true
eval:
  metrics: [ece, brier, coverage, set_size]
  bootstrap_iters: 1000
