experiment_id: sensitivity_temperature
description: Sweep tau over [0.8, 1.0, 1.32, 1.8] (Supp. Table S5 middle block).
seed: 42
phases: [phase3]
sweep:
  variable: temperature
  values: [0.8, 1.0, 1.32, 1.8]
data:
  primary: code
model:
  fusion: hgcf
uq:
  mc_dropout:
    num_samples: 20
    dropout_p: 0.1
  temperature:
    enabled: true
  raps:
    enabled: true
    alpha: 0.05
    penalty: 0.01
  risk_tier:
    auto_calibrate: true
eval:
  metrics: [ece, brier, coverage, set_size]
  bootstrap_iters: 1000
