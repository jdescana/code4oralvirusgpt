train_batch_size: auto
train_micro_batch_size_per_gpu: auto
gradient_accumulation_steps: 1
gradient_clipping: 1.0
zero_optimization:
  stage: 2
  contiguous_gradients: true
  overlap_comm: true
  reduce_scatter: true
  reduce_bucket_size: 5.0e8
  allgather_bucket_size: 5.0e8
bf16:
  enabled: true
fp16:
  enabled: false
optimizer:
  type: AdamW
  params:
    lr: 5.0e-5
    betas: [0.9, 0.999]
    eps: 1.0e-8
    weight_decay: 0.0
scheduler:
  type: WarmupDecayLR
  params:
    warmup_min_lr: 0.0
    warmup_max_lr: 5.0e-5
    warmup_num_steps: 500
    total_num_steps: auto
steps_per_print: 100
wall_clock_breakdown: false
