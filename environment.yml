name: oral_virus_gpt
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pytorch=2.1.2
  - torchvision=0.16.2
  - pytorch-cuda=12.1
  - numpy<2.0
  - scipy=1.13.*
  - scikit-learn=1.5.*
  - pandas=2.2.*
  - pyyaml=6.0.*
  - matplotlib=3.9.*
  - seaborn=0.13.*
  - pillow=10.3.*
  - opencv=4.10.*
  - pip:
      - transformers>=4.40,<4.42
      - peft~=0.10
      - accelerate~=0.30
      - deepspeed~=0.14
      - omegaconf~=2.3
      - hydra-core~=1.3
      - pydicom~=2.4
      - tifffile>=2024.5.10
      - tqdm~=4.66
      - rich~=13.7
      - httpx~=0.27
      - huggingface-hub~=0.23
      - safetensors~=0.4
      - onnx~=1.16
