[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oral-virus-gpt"
version = "0.1.0"
description = "Multimodal LLM for oral disease diagnosis with calibrated uncertainty and risk stratification."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "OralVirusGPT authors" }]
keywords = [
    "multimodal",
    "medical-ai",
    "oral-disease",
    "uncertainty-quantification",
    "conformal-prediction",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch==2.1.2",
    "torchvision==0.16.2",
    "transformers>=4.40,<4.42",
    "peft~=0.10",
    "accelerate~=0.30",
    "deepspeed~=0.14",
    "numpy<2.0",
    "scipy~=1.13",
    "scikit-learn~=1.5",
    "pandas~=2.2",
    "pyyaml~=6.0",
    "omegaconf~=2.3",
    "hydra-core~=1.3",
    "pillow~=10.3",
    "opencv-python~=4.10",
    "pydicom~=2.4",
    "tifffile>=2024.5.10",
    "matplotlib~=3.9",
    "seaborn~=0.13",
    "tqdm~=4.66",
    "rich~=13.7",
    "httpx~=0.27",
    "huggingface-hub~=0.23",
    "safetensors~=0.4",
    "onnx~=1.16",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.2",
    "pytest-xdist~=3.6",
    "pytest-cov~=5.0",
    "pytest-mock~=3.14",
    "mypy~=1.10",
    "ruff~=0.4",
    "black~=24.4",
    "isort~=5.13",
    "pre-commit~=3.7",
    "types-pyyaml~=6.0",
    "types-pillow~=10.2",
]

[project.scripts]
oral-virus-gpt = "oral_virus_gpt.runners.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["oral_virus_gpt*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["assets", "results", "benchmarks/cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501", "N812", "N806"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "N802"]
"src/oral_virus_gpt/runners/**" = ["B008"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["oral_virus_gpt"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_unused_ignores = false
warn_return_any = false
disallow_untyped_calls = false
disallow_subclassing_any = false
exclude = ["build/", "dist/", "tests/"]

[[tool.mypy.overrides]]
module = ["torch.*", "transformers.*", "peft.*", "deepspeed.*", "accelerate.*", "cv2.*", "tifffile.*", "pydicom.*", "matplotlib.*", "seaborn.*", "scipy.*", "sklearn.*", "huggingface_hub.*", "safetensors.*", "onnx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "gpu: requires a CUDA device; skipped on the default runner",
    "slow: requires more than ~30s to run",
    "integration: requires real datasets to be present locally",
]
filterwarnings = [
    "ignore::DeprecationWarning:torch.*",
    "ignore::UserWarning:torch.*",
]
